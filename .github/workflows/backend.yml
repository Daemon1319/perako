name: Backend CI and deploy

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://frontend.example.test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backend_test
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - name: Check Ruby style
        run: bundle exec rubocop
      - name: Scan application security
        run: bundle exec brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - name: Audit dependencies
        run: bundle exec bundler-audit check --update
      - name: Prepare database and run tests
        run: bundle exec rails db:prepare test

  deploy:
    name: Deploy backend to Azure
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: perako-backend-production
      cancel-in-progress: false
    env:
      REGISTRY_SERVER: ghcr.io
      IMAGE_NAME: ghcr.io/daemon1319/perako-api
      RESOURCE_GROUP: perako-rg
      CONTAINER_APP: perako-api
    steps:
      - uses: actions/checkout@v6
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check registry pull credential
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "::error::Add the GHCR_PULL_TOKEN repository secret with read:packages permission before deploying."
            exit 1
          fi
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_PUSH_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_PUSH_TOKEN" | docker login "$REGISTRY_SERVER" --username "$GHCR_USERNAME" --password-stdin
      - name: Build and push the backend image
        run: |
          image="$IMAGE_NAME:$GITHUB_SHA"
          docker build --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker push "$image"
      - name: Deploy the image
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp registry set \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --server "$REGISTRY_SERVER" \
            --username "$GHCR_USERNAME" \
            --password "$GHCR_PULL_TOKEN" \
            --output none
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name perako-api \
            --image "$IMAGE_NAME:$GITHUB_SHA" \
            --output none
      - name: Check backend health
        run: |
          app_host=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$app_host"
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            "https://$app_host/up"
