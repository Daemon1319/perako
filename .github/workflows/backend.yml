name: Backend CI and deploy

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      RAILS_ENV: test
      FRONTEND_URL: https://frontend.example.test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backend_test
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - name: Check Ruby style
        run: bundle exec rubocop
      - name: Scan application security
        run: bundle exec brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - name: Audit dependencies
        run: bundle exec bundler-audit check --update
      - name: Prepare database and run tests
        run: bundle exec rails db:prepare test

  deploy:
    name: Deploy backend to Azure
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: perako-backend-production
      cancel-in-progress: false
    env:
      REGISTRY_NAME: perako1319
      REGISTRY_SERVER: perako1319-h5f3h6h4azg6f4c5.azurecr.io
      RESOURCE_GROUP: perako-rg
      CONTAINER_APP: perako-api
    steps:
      - uses: actions/checkout@v6
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to the container registry
        run: az acr login --name "$REGISTRY_NAME"
      - name: Build and push the backend image
        run: |
          image="$REGISTRY_SERVER/perako-api:$GITHUB_SHA"
          docker build --tag "$image" .
          docker push "$image"
      - name: Deploy the image
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name perako-api \
            --image "$REGISTRY_SERVER/perako-api:$GITHUB_SHA" \
            --output none
      - name: Check backend health
        run: |
          app_host=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$app_host"
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            "https://$app_host/up"
